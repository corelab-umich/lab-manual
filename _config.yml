title: CORE Lab Manual
description: Shared hardware, software, and experiment documentation for CORE Lab.
url: https://corelab-umich.github.io
baseurl: /lab-manual
theme: just-the-docs
color_scheme: core
search_enabled: true
heading_anchors: true
aux_links:
  CORE Lab website:
    - /
gh_edit_link: false # Enable only after the remote repository exists.
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/corelab-umich/lab-manual
gh_edit_branch: main
gh_edit_view_mode: edit
last_edit_timestamp: true
last_edit_time_format: "%b %e, %Y"
callouts:
  draft:
    title: Draft — lab review required
    color: yellow
exclude: [README.md, CONTRIBUTING.md, projects/seatrac-sp48/provenance.json, Gemfile, Gemfile.lock, vendor, scripts, templates]
defaults:
  - scope:
      path: ""
    values:
      layout: default
